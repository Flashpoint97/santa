name: CI

# Quality gate for every push to the default branch and every pull request.
# No secrets are used: the only "secret" is a throwaway HMAC key generated per run, and all data
# is synthetic (backend/list.example.json plus generated placeholder GIFs). Pages and Render
# deploys are separate (ticket 11) and not part of this file.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, ty, pytest, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: santa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/santa_test
      # Alembic and the CLI read the app Settings, which refuse to start without these.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/santa_migrate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Generate a throwaway HMAC key
        run: echo "CODE_HMAC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ty check
        run: uv run ty check app
      - name: pytest (Postgres)
        run: uv run pytest
      - name: Create the migration database
        run: psql -h localhost -U postgres -d santa_test -c "CREATE DATABASE santa_migrate"
      - name: Migration round trip (upgrade, downgrade, upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Migration drift check (alembic check)
        run: uv run alembic check

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      # Public by design (inlined into the bundle); the CI build never talks to it.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  smoke:
    name: Smoke test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: santa_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_PORT: "8000"
      WEB_PORT: "3000"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/santa_smoke
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            e2e/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate test values
        run: |
          {
            echo "CODE_HMAC_SECRET=$(openssl rand -hex 32)"
            # The backend answers browsers loaded from the static server's origin only.
            echo "CORS_ORIGINS=[\"http://localhost:${WEB_PORT}\"]"
            echo "NEXT_PUBLIC_API_URL=http://localhost:${API_PORT}"
            echo "SMOKE_FRONTEND_URL=http://localhost:${WEB_PORT}"
            echo "SMOKE_CODES_FILE=${RUNNER_TEMP}/codes.txt"
          } >> "$GITHUB_ENV"

      - name: Backend - install, migrate, seed, draw
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python scripts/make_placeholder_gifs.py
          # Same synthetic list as list.example.json, with the exchange date pushed far into the
          # future so the Countdown never flips to the after-event message as the calendar moves.
          sed 's/"exchange_at": "[^"]*"/"exchange_at": "2099-12-31T12:00"/' \
            list.example.json > list.smoke.local.json
          # The printed Codes are saved for the browser test (they are synthetic and single-run).
          uv run python -m app.cli load list.smoke.local.json > "$SMOKE_CODES_FILE"
          uv run python -m app.cli draw

      - name: Backend - start the API
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:app --host localhost --port "$API_PORT" \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS "http://localhost:${API_PORT}/health" && exit 0
            sleep 1
          done
          echo "API did not become healthy" >&2
          cat "$RUNNER_TEMP/api.log" >&2
          exit 1

      - name: Frontend - build the static site
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Frontend - serve out/
        run: |
          nohup python3 -m http.server "$WEB_PORT" --bind localhost --directory frontend/out \
            > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "http://localhost:${WEB_PORT}/" && exit 0
            sleep 1
          done
          echo "Static server did not start" >&2
          cat "$RUNNER_TEMP/web.log" >&2
          exit 1

      - name: Playwright - install Chromium
        working-directory: e2e
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Playwright - run the smoke test
        working-directory: e2e
        run: uv run pytest -v

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-failure
          # Screenshot and server logs; the logs never contain Codes or Assignments.
          path: |
            e2e/artifacts/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore
          retention-days: 7
